[package]
name = "get-audio-bridge"
version = "0.2.2"
edition = "2021"

[lib]
name = "get_audio_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bridge-core = { path = "../crates/bridge-core" }
tauri-plugin-audio-output = { path = "../plugins/tauri-plugin-audio-output" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
local-ip-address = "0.6"
windows = { version = "0.62", features = ["Win32_Media_Audio"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
